# Builds the engine-independent code (calculator, geometry, keyboard models) natively under
# Unreal's constraints and runs every test and reference case; then regenerates the reference
# cases from a fresh checkout of Where It Isn't and fails if any expected value changed.
# Unreal itself is not available on hosted runners, so the engine layer is not built here.
name: native-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Tests -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release
      - name: Build (strict flags, unity target included)
        run: cmake --build build -j4
      - name: Run tests and reference cases
        run: ./build/mcalc_tests

  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jcorky/where-it-isnt
          path: where-it-isnt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=2,<3"
      - name: Keep the committed cases
        run: cp -r Tests/reference "$RUNNER_TEMP/committed"
      - name: Regenerate the reference cases from Where It Isn't
        run: Tests/reference/regenerate.sh "$GITHUB_WORKSPACE/where-it-isnt"
      - name: The regenerated cases must match the committed ones
        run: python3 Tests/reference/compare.py "$RUNNER_TEMP/committed" Tests/reference
